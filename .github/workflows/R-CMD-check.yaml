# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    # The two ubuntu-latest names here are load-bearing: `ubuntu-latest
    # (release)` and `ubuntu-latest (devel)` are required status checks on
    # `main`, matched by name. Renaming either one means the required check
    # never reports, which GitHub reads as pending forever and makes every PR
    # unmergeable -- the same trap documented on the reproducibility gate's
    # `paths:` filter. Adding a job is safe; renaming one is not. The required
    # set is enforced by a ruleset, not classic branch protection, so it is
    # `gh api repos/rdotsch/rcicr/rules/branches/main` that shows it.
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: ubuntu-latest, r: 'release'}
          - {os: ubuntu-latest, r: 'devel', http-user-agent: 'release'}
          # macOS is here because the suite had never run on it. The first
          # macOS run of any kind -- an R-hub dispatch on 2026-07-28, made
          # while preparing the CRAN resubmission -- failed a plotZmap() test
          # that had been green on Linux since b7cb6d9, because the macOS
          # quartz PNG device writes an alpha channel where cairo does not.
          # CRAN builds on macOS, so that would have surfaced as an ERROR
          # during submission rather than on a PR. Release only: the gap this
          # closes is the graphics backend and the platform, neither of which
          # varies with the R version, so a second macOS job would buy little.
          - {os: macos-latest, r: 'release'}
          # Windows is the other platform CRAN gates on. Unlike macOS it was
          # not untested -- the same R-hub dispatch ran it green, and
          # win-builder passed twice -- so this is about *when* rather than
          # whether: both of those are release-time checks, and finding a
          # Windows-only failure at submission is exactly the lateness the
          # macOS row was added to fix. It also puts the pinned z-map values in
          # test-regression-baseline.R in front of a third platform and a
          # different BLAS.
          - {os: windows-latest, r: 'release'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          # roxygen2 is pinned, and to DESCRIPTION's RoxygenNote: .Rd output
          # varies between generator versions, so `any::` would let a CRAN
          # release of roxygen2 fail the documentation step below on formatting
          # alone. Only that step needs it, on one job -- installing it on all
          # four is the price of not putting a matrix conditional here.
          extra-packages: |
            any::rcmdcheck
            roxygen2@7.3.1
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # The check above catches man/ that disagrees with a function's signature
      # (tools::codoc). It never runs roxygen, so it cannot catch prose drift --
      # an edited @description or @examples that was not regenerated -- which
      # ships to the pkgdown site, built from man/. Last, so a failure here
      # cannot cost us the check results.
      - name: Documentation is up to date
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        run: |
          Rscript -e 'want <- read.dcf("DESCRIPTION", "RoxygenNote")[[1]]' \
                  -e 'have <- as.character(packageVersion("roxygen2"))' \
                  -e 'if (have != want) stop("roxygen2 ", have, " installed, DESCRIPTION says ", want, ": update the pin in this workflow to match.")' \
                  -e 'roxygen2::roxygenise(load_code = "source")'
          # Staged, because `git diff` alone ignores untracked files: a new
          # documented *internal* function leaves NAMESPACE untouched, so its
          # missing man/*.Rd would be invisible and the gate would pass.
          git add -A -- man NAMESPACE
          git diff --cached --exit-code -- man NAMESPACE \
            || { echo "::error::man/ or NAMESPACE is stale. Run roxygen2::roxygenise() and commit the result."; exit 1; }

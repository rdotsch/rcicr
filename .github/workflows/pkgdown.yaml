# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest

    # Only one deploy at a time, but let concurrent PR builds run: they never
    # touch gh-pages.
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

    # The repo default is read-all; deploying needs to push the gh-pages branch.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      # Pull requests build the site but do not publish it: the point on a PR is
      # to catch a broken _pkgdown.yml or a vignette that no longer knits,
      # before it reaches main.
      #
      # GitHub Pages is already configured on this repo to serve the `gh-pages`
      # branch (`gh api repos/rdotsch/rcicr/pages` -> build_type: legacy), so
      # pushing that branch is all it takes to publish. Third-party action,
      # so pinned by SHA like codecov in test-coverage.yaml.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.9.0
        with:
          clean: false
          branch: gh-pages
          folder: docs

url: https://rdotsch.github.io/rcicr/

template:
  bootstrap: 5

# pkgdown renders every root-level .md except a hardcoded few, with no way to
# opt out, so AGENTS.md and CLAUDE.md become pages whether or not that is
# wanted. Nothing links to them, but they were landing in site search ahead of
# real documentation. CONTRIBUTING.md, DECISIONS.md, RELEASING.md,
# MAINTENANCE.md and SECURITY.md stay indexed: those are for humans and worth
# finding. The pages still exist and still appear in
# sitemap.xml -- that is built from the files on disk and has no exclusion hook.
search:
  exclude:
    - AGENTS.html
    - CLAUDE.html

# Explicit so the individual-CI advisory (a pkgdown-only article, not a real
# vignette -- see vignettes/articles/ in .Rbuildignore) gets its own group
# instead of being interleaved with the getting-started tutorials in
# pkgdown's default alphabetical article index.
articles:
  - title: Get started
    contents:
      - getting-started
      - reverse-correlation-walkthrough
  - title: Advisories
    contents:
      - articles/rcicr-individual-ci-advisory

# Ordered so the top of the page is what people actually call. The section
# titles match README.md -> "How it works"; keep them in step if either moves.
reference:
  - title: Generating stimuli
    desc: >
      Build a stimulus set for a 2IFC task. The .Rdata file written here is the
      only link to the analysis half, so keep it.
    contents:
      - generateStimuli2IFC
      - simulateNoiseIntensities

  - title: Classification images
    desc: >
      Turn collected responses into classification images, and render them.
    contents:
      - generateCI
      - generateCI2IFC
      - batchGenerateCI
      - batchGenerateCI2IFC
      - autoscale
      - plotZmap
      - computeCumulativeCICorrelation

  - title: Informational value
    desc: >
      How much signal a classification image carries, against a simulated null.
    contents:
      - computeInfoVal2IFC
      - generateReferenceDistribution2IFC

  - title: Noise basis
    desc: >
      The sinusoid and Gabor machinery the stimuli are built from. Exported so
      the noise can be inspected and reused; most analyses never call these
      directly.
    contents:
      - generateNoisePattern
      - generateNoiseImage
      - generateCINoise
      - generateSinusoid
      - generateGabor
      - deg2rad

  - title: Latent-space reverse correlation (experimental)
    desc: >
      Reverse correlation in the latent space of a generative face model rather
      than in the sinusoid basis. Switched off unless
      options(rcicr.experimental = TRUE) is set, because the numeric output is
      not yet stable.
    contents:
      - generateStimuliLatent2IFC
      - generateLatentCI
      - searchLatent2IFC
      - computeLatentInfoVal2IFC
      - latentGeneratorPCA

  - title: Package
    contents:
      - rcicr-package
